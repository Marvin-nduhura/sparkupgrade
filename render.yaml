services:
  - type: web
    name: buildspark
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm exec prisma generate && npm run build && npm exec prisma db push && node -e "const{PrismaClient}=require('@prisma/client');const bcrypt=require('bcryptjs');const prisma=new PrismaClient();async function seed(){const h=async p=>bcrypt.hash(p,12);await prisma.user.upsert({where:{email:'admin@sparkconst.co.ug'},update:{},create:{name:'System Administrator',email:'admin@sparkconst.co.ug',password:await h('Admin@2024!'),role:'SYSTEM_ADMIN',phone:'+256700000001',mtnNumber:'+256770000001'}});await prisma.user.upsert({where:{email:'manager@sparkconst.co.ug'},update:{},create:{name:'John Kato',email:'manager@sparkconst.co.ug',password:await h('Manager@2024!'),role:'SITE_MANAGER',phone:'+256700000002',mtnNumber:'+256770000002'}});await prisma.user.upsert({where:{email:'accounts@sparkconst.co.ug'},update:{},create:{name:'Grace Namukasa',email:'accounts@sparkconst.co.ug',password:await h('Account@2024!'),role:'ACCOUNTANT',phone:'+256700000003',airtelNumber:'+256750000003'}});await prisma.companySettings.upsert({where:{id:'default'},update:{},create:{id:'default',companyName:'Spark Construction Limited',currency:'UGX',currencySymbol:'UGX',email:'info@sparkconst.co.ug',phone:'+256700000000',address:'Kampala, Uganda'}});console.log('Users ready.');}seed().catch(e=>console.warn('Seed warning:',e.message)).finally(()=>prisma.\$disconnect());"
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: buildspark-db
          property: connectionString
      - key: NEXTAUTH_URL
        value: https://buildspark-4mn0.onrender.com
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PESAPAL_CONSUMER_KEY
        sync: false
      - key: PESAPAL_CONSUMER_SECRET
        sync: false
      - key: PESAPAL_BASE_URL
        value: https://pay.pesapal.com/v3
      - key: PESAPAL_IPN_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        value: https://buildspark-4mn0.onrender.com

databases:
  - name: buildspark-db
    databaseName: buildspark
    user: buildspark_user
    plan: free
    region: oregon
